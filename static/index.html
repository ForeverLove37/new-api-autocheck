<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f5" />
    <title>AutoCheck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="auth-shell" class="auth-shell" hidden>
      <form id="login-form" class="auth-panel">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>AutoCheck</span>
        </div>
        <h1>Administrator access</h1>
        <label>
          Password
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button button-primary button-full" type="submit">Sign in</button>
      </form>
    </div>

    <div id="app-shell" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>AutoCheck</span>
        </div>
        <div class="topbar-actions">
          <button class="button button-quiet" data-action="refresh" type="button">Refresh</button>
          <button id="logout-button" class="button button-quiet" type="button">Sign out</button>
        </div>
      </header>

      <div class="application-layout">
        <nav class="sidebar" aria-label="Application navigation">
          <button class="nav-item is-active" data-view="overview" type="button">Overview</button>
          <button class="nav-item" data-view="accounts" type="button">Accounts</button>
          <button class="nav-item" data-view="proxies" type="button">Proxies</button>
          <button class="nav-item" data-view="settings" type="button">Site settings</button>
          <button class="nav-item" data-view="activity" type="button">Activity</button>
        </nav>
        <main id="content" class="content" tabindex="-1"></main>
      </div>
    </div>

    <dialog id="modal" class="modal"></dialog>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
